name: twenty

services:
  server:
    image: twentycrm/twenty:v2.54.0@sha256:e64479a4daa9211864eb45ffdf15ce7a44a3664850dab06213105027538fce1e
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    env_file:
      - path: .env
        required: true
    networks:
      - caddy
      - redis
      - postgres
      - default
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    labels:
      caddy: "*.acbc.house"
      caddy.@crm.host: "crm.acbc.house"
      caddy.reverse_proxy: "@crm {{upstreams http 3000}}"

  worker:
    image: twentycrm/twenty:v2.54.0@sha256:e64479a4daa9211864eb45ffdf15ce7a44a3664850dab06213105027538fce1e
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    env_file:
      - path: .env
        required: true
    environment: 
      DISABLE_DB_MIGRATIONS: "true" # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # it already runs on the server
    networks:
      - default
      - redis
      - postgres
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes: 
  server-local-data:

networks:
  caddy:
    external: true
  postgres:
    external: true
  redis:
    external: true
  default:
    driver: bridge
