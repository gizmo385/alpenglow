services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    container_name: alpenglow-dashboard-oauth2-proxy
    restart: unless-stopped
    env_file: .proxy_env
    networks:
      - caddy
    labels:
      caddy: acbc.house
      caddy.reverse_proxy: "{{upstreams 4180}}"
    depends_on:
      - dashboard

  dashboard:
    build: ./app
    container_name: alpenglow_dashboard
    # Full Docker API via /services/docker-proxy: it runs `docker compose` (up,
    # pull, restart), which is root-equivalent on the host. Behind Keycloak's
    # Admin group (oauth2-proxy + PROXY_AUTH_SECRET).
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-manage
    restart: unless-stopped
    environment:
      TZ: America/Denver
      # Traces to SigNoz via Alloy. service.name matches the name Alloy derives
      # for this container's logs so SigNoz can correlate them.
      OTEL_SERVICE_NAME: alpenglow_dashboard
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=alpenglow_dashboard
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
      # Upgrades board: a card in Vikunja's Upgrades project for each pending
      # upgrade of an image in versions.yaml, and Claude's verdicts back in the
      # Updates view and the Discord digest. VIKUNJA_API_TOKEN is in .env.
      VIKUNJA_API_URL: http://vikunja:3456/api/v1
      VIKUNJA_PROJECT_ID: "2"   # Upgrades
      VIKUNJA_PUBLIC_URL: https://board.acbc.house
    env_file:
      - path: .env
        required: true
    volumes:
      # Read-write so Update can repin images in versions.yaml and the
      # compose files (./pin set, run as the checkout's owner). Nothing is
      # committed; see app/README.md, "Updating services".
      - /services:/services
      - ./data:/data-store
      - /data/postgres_backups:/pg-backups:ro
    expose:
      - "8080"
    networks:
      - caddy
      # Vikunja's API, and the tracker's Discord bot reading
      # /internal/upgrades/annotations.
      - board

networks:
  caddy:
    external: true
  board:
    external: true
  docker-proxy:
    external: true
