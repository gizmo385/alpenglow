# synthetic fixture: proxy-level SSO via a Caddy forward_auth label
services:
  app:
    image: example/app:latest
    restart: unless-stopped
    labels:
      caddy: "*.acbc.house"
      caddy.@svc.host: "svc.acbc.house"
      caddy.reverse_proxy: "@svc {{upstreams 8080}}"
      caddy.forward_auth: "auth-host {{upstreams 4180}}"
