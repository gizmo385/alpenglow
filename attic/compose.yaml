services:
  atticd:
    image: ghcr.io/zhaofengli/attic:12cbeca141f46e1ade76728bce8adc447f2166c6@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
    container_name: atticd
    env_file: ./.env
    restart: unless-stopped
    command: ["-f", "/config/server.toml"]
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./storage:/storage
    environment:
      - RUST_LOG=info
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@attic.host: "attic.alpenglow.acbc.house"
      caddy.reverse_proxy: "@attic {{upstreams 8080}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
