# Job profiles for the Claude dispatcher.
#
# A card's Vikunja project decides its profile; a card can never choose or
# widen it. Every change here is a change to what Claude may do, so it goes
# through review like any other code.
#
# Every profile can reach api.anthropic.com. `egress` adds hosts (a name also
# allows its subdomains). `allowed_tools` is passed to `claude --allowedTools`;
# anything not listed is refused in headless mode.
#
# `allowed_users` are Vikunja usernames. With Keycloak login, Vikunja uses the
# Keycloak username, which for us is the email address.

defaults:
  image: claude-job:local
  max_turns: 30
  timeout_minutes: 15
  memory: 2g
  cpus: 1
  # runtime: runsc   # gVisor, once installed on the job daemon

profiles:
  # Upgrade assessments: one card per pending image upgrade, filed by hand
  # for now and later by the update tracker. Reads release notes and
  # advisories, then rates the upgrade. It can't change anything: the bump
  # itself stays with a person (and later the approval flow).
  upgrade:
    description: Assesses one image upgrade. No repository, read-only tools.
    allowed_tools: [WebSearch, WebFetch, Read, Grep, Glob]
    egress:
      - github.com              # release notes, changelogs, issues
      - githubusercontent.com
      - hub.docker.com          # tag lists
      - api.osv.dev             # security advisories
      - jellyfin.org
      - home-assistant.io
      - caddyserver.com
      - docs.tandoor.dev
    allowed_users: [chris@acbc.house, adam@acbc.house]
    max_turns: 30
    timeout_minutes: 20
    # Kanban columns from vikunja/README.md, and the verdicts that become
    # "Verdict: ..." labels (green, amber, red in this order).
    buckets:
      working: Assessing
      replied: Done
    verdicts: [Easy, Needs care, Hold]
    instructions: |
      The card names a service, its current version and the version to
      assess, and may list apps or plugins that must keep working with it.
      Read the release notes for every version in between, not just the
      newest one.

      Keep the reply short; it's read on a phone. Start with exactly one of
      "Verdict: Easy", "Verdict: Needs care" or "Verdict: Hold", followed by
      one sentence saying why.

      Then list only what we need to know or do, each as a short bullet with
      a source link: breaking changes that affect us (config, env vars,
      database migrations, removed features), security fixes, problems with
      the listed apps or plugins, and steps beyond bumping the tag. Leave
      out anything with nothing to report, and don't list what you checked.
      If something important couldn't be verified, say so in one line.

  # Security assessments: one card per service with open findings, filed and
  # kept up to date by the dashboard from the cve-scanner's nightly scan
  # (alpenglow_dashboard/app/backend/alpenglow_dashboard/security/). Decides
  # whether the findings matter for how we run the service. Read-only, like
  # upgrade: fixing stays with a person.
  security:
    description: Assesses one service's open CVE findings. No repository, read-only tools.
    allowed_tools: [WebSearch, WebFetch, Read, Grep, Glob]
    egress:
      - github.com              # advisories, fix commits, our compose files
      - githubusercontent.com
      - api.osv.dev             # advisory details
      - osv.dev
      - nvd.nist.gov
      - cisa.gov                # known-exploited catalogue
      - api.first.org           # EPSS
      - pkg.go.dev              # Go vulnerability reports
      - security-tracker.debian.org
      - security.alpinelinux.org
      - caddyserver.com
    allowed_users: [chris@acbc.house, adam@acbc.house]
    max_turns: 30
    timeout_minutes: 20
    buckets:
      working: Assessing
      replied: Done
    # Green, blue, amber, red in this order. The dashboard pings Discord on
    # Act now, and its digest lists only Act now and Next upgrade: the other
    # two mean there's nothing for us to do, so they're only counted.
    verdicts: [Not affected, Waiting on upstream, Next upgrade, Act now]
    instructions: |
      The card lists the open security findings for one service on our home
      server: each CVE or advisory, the package and version, the fixed
      version, whether it's on CISA's known-exploited list, its EPSS score,
      and which image it's in. It also says how the service is exposed
      (public on the internet, tailnet only, or no ingress), the version we
      run and whether a newer release exists, whether the image is built on
      the server, and links the service's compose file.

      Two things about the list. "Fixed in" is the version of the *package*
      that has the fix (a Debian, Alpine, npm or Go release), not a version
      of the service: it doesn't mean an image we can pull contains it. And
      the list is long because it's every High or Critical package match in
      the image, so most of it is usually base-image packages the app never
      uses. The count says nothing about risk.

      Decide whether the findings matter for how we run this service, and
      whether there is anything for us to do. A vulnerable package isn't the
      same as a vulnerable service: check whether the vulnerable code is
      reachable (a library the app never calls, a CLI tool in the base image,
      a server feature we don't enable), and weigh the exposure.
      Known-exploited and public matter most.

      The verdict says what we should do, so pick it by the action:

      - Act now: you found evidence that it's exploitable as we run it, and
        it's serious enough that it shouldn't wait. Evidence means the
        compose file, the advisory and the app's code or docs together show
        an attacker who can reach the service can reach the bug. A guess
        isn't enough: an `expose:` line doesn't publish a port, and you
        can't see config files or what runs inside the container. If the
        answer depends on something you can't see, don't choose Act now.
        Choose the verdict that fits if the answer is the safe one, and make
        the first bullet the one thing to check and what it would change.
        The exception is a known-exploited finding in a public service that
        you can't rule out: that is Act now.
      - Next upgrade: real, not urgent, and a fix exists that we can take
        today: the card says a newer release is out and it fixes this, or
        the image is built on the server and a rebuild picks the fix up.
        Name the release or say "rebuild".
      - Waiting on upstream: real and reachable enough to want fixed, but
        nothing we can pull or rebuild fixes it yet. This is the usual
        answer when we run the latest release and the fixes are in packages
        the maintainer hasn't rebuilt the image with. Say what we're waiting
        for.
      - Not affected: not reachable or not relevant as we run it, whether or
        not a fix exists.

      Judge by the finding that matters most, not the number of them. If
      the findings split (most unreachable, one worth fixing), the verdict
      follows the one worth fixing.

      Keep the reply short; it's read on a phone. Start with exactly one of
      "Verdict: Act now", "Verdict: Next upgrade", "Verdict: Waiting on
      upstream" or "Verdict: Not affected", followed by one sentence saying
      why. That sentence is shown on its own in the dashboard and the daily
      digest, so it must make sense alone: name the finding or package that
      decided it and, for Act now and Next upgrade, the step to take.

      Then list only what we need to know or do, each as a short bullet with
      a source link: the findings that drive the verdict, the fix (upgrade
      to which version, a rebuild, or a mitigation such as a config change),
      and any finding to add to cve-scanner/ignore.yaml with a one-line
      reason. Group findings with the same answer rather than going one by
      one. If something important couldn't be verified, say so in one line.

      When a comment says there are new findings or that the running image
      changed, assess the whole list again and give a fresh verdict: an
      earlier verdict was about a different image or a different list. When
      a comment asks a question, answer it and repeat the verdict line,
      updated if your answer changes it.

projects:
  # Vikunja project id: profile. Find the id in the project's URL.
  2: upgrade   # Upgrades
  5: security  # Security
