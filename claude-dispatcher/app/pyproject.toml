[project]
name = "claude-dispatcher"
version = "0.1.0"
description = "Runs sandboxed Claude jobs for Vikunja cards"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "docker>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
