# Upgrades board: keeps Vikunja's Upgrades project in step with the update
# tracker (one card per pending upgrade, which the Claude dispatcher assesses)
# and serves Claude's verdicts to the dashboard and the Discord digest.
services:
  upgrades-board:
    build: ./app
    restart: unless-stopped
    env_file:
      - path: .env   # VIKUNJA_API_TOKEN
        required: true
    environment:
      TRACKER_URL: http://updates-tracker-release-feeds-1:8585
      VIKUNJA_API_URL: http://vikunja:3456/api/v1
      VIKUNJA_PROJECT_ID: "2"   # Upgrades
      VIKUNJA_PUBLIC_URL: https://board.acbc.house
      # Only images listed here get cards, never `policy: float` ones.
      VERSIONS_PATH: /config/versions.yaml
    volumes:
      - ../versions.yaml:/config/versions.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks:
      # Vikunja's API. No Caddy labels: only the tracker's bot and the
      # dashboard read /annotations, over these networks.
      board:
        aliases: [upgrades-board]
      # The tracker's /api/updates, and the dashboard.
      caddy:
        aliases: [upgrades-board]

networks:
  board:
    external: true
  caddy:
    external: true
