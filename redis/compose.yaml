services:
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - redis
    deploy:
      resources:
        limits:
          memory: 6G

networks:
  redis:
    external: true
