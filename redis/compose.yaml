services:
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - redis
    deploy:
      resources:
        limits:
          memory: 6G

networks:
  redis:
    external: true
