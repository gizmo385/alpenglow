services:
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai
    expose:
      - 11434
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list; do sleep 2; done && ollama pull qwen2.5:1.5b"]
    restart: no

volumes:
  ollama_data:

networks:
  ai:
    driver: bridge
    name: ai
