services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: copyparty-oauth2-proxy
    restart: unless-stopped
    env_file: .proxy_env
    networks:
      - caddy
      # Session store (OAUTH2_PROXY_REDIS_CONNECTION_URL).
      - redis
      - backend
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@files.host: "files.acbc.house"
      caddy_0.reverse_proxy: "@files {{upstreams 4180}}"
      # Old name, kept so bookmarks and shared links still work.
      caddy_1: "*.alpenglow.acbc.house"
      caddy_1.@files_old.host: "files.alpenglow.acbc.house"
      caddy_1.redir: "@files_old https://files.acbc.house{uri} permanent"
    depends_on:
      - copyparty

  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "1003"
    volumes:
      - /data/share:/srv
      - /data/jellyfin/media:/srv/jellyfin
      - ./copyparty.conf:/copyparty.conf:ro
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Denver
    command: >
      -c /copyparty.conf
      --http-only
    networks:
      # Only oauth2-proxy can reach it. copyparty takes the username from the
      # proxy's headers, so anything else that could connect could claim to be
      # anyone (see xff-src in copyparty.conf).
      - backend

networks:
  redis:
    external: true
  caddy:
    external: true
  backend:
    # No route out, and a fixed subnet so copyparty.conf can trust exactly it.
    internal: true
    ipam:
      config:
        - subnet: 10.0.16.0/24
