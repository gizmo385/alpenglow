services:
  release-feeds:
    # Read-only Docker API via /services/docker-proxy.
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read
    image: ghcr.io/gizmo385/image-updates-tracker:main
    volumes:
      - ./overrides.yaml:/config/overrides.yaml:ro
    env_file: .env
    environment:
      # Upgrades cards are filed by ../upgrades-board from this service's
      # /api/updates; the tracker itself doesn't talk to Vikunja.
      # Traces to SigNoz via Alloy. service.name matches the name Alloy derives
      # for this container's logs so SigNoz can correlate them.
      OTEL_SERVICE_NAME: updates-tracker-release-feeds
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=updates-tracker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
    restart: unless-stopped
    networks:
      - caddy
      - ai
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@updates.host: "updates.alpenglow.acbc.house"
      caddy.reverse_proxy: "@updates {{upstreams http 8585}}"

  discord-bot:
    # Read-only Docker API via /services/docker-proxy.
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read
    image: ghcr.io/gizmo385/image-updates-tracker-bot:main
    volumes:
      - ./overrides.yaml:/config/overrides.yaml:ro
    env_file: .env
    environment:
      # The digest leads with the open Upgrades cards and Claude's verdicts,
      # served by ../upgrades-board.
      ANNOTATIONS_URL: http://upgrades-board:8080/annotations
      OTEL_SERVICE_NAME: updates-tracker-discord-bot
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=updates-tracker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
    restart: unless-stopped
    networks:
      - ai
      - board
      - otel

networks:
  caddy:
    external: true
  board:
    external: true
  ai:
    external: true
  otel:
    external: true
  docker-proxy:
    external: true
