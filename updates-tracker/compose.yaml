services:
  release-feeds:
    # Read-only Docker API via /services/docker-proxy.
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read
    image: ghcr.io/gizmo385/image-updates-tracker:main
    volumes:
      - ./overrides.yaml:/config/overrides.yaml:ro
      # Only images listed here get Upgrades cards (see claude-dispatcher).
      - ../versions.yaml:/config/versions.yaml:ro
    env_file: .env
    environment:
      # Files a card in Vikunja's Upgrades project for each pending upgrade of
      # an image in versions.yaml. VIKUNJA_API_TOKEN is in .env.
      VIKUNJA_API_URL: http://vikunja:3456/api/v1
      VIKUNJA_PROJECT_ID: "2"
      VERSIONS_PATH: /config/versions.yaml
      # Traces to SigNoz via Alloy. service.name matches the name Alloy derives
      # for this container's logs so SigNoz can correlate them.
      OTEL_SERVICE_NAME: updates-tracker-release-feeds
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=updates-tracker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
    restart: unless-stopped
    networks:
      - caddy
      - ai
      - board
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@updates.host: "updates.alpenglow.acbc.house"
      caddy.reverse_proxy: "@updates {{upstreams http 8585}}"

  discord-bot:
    # Read-only Docker API via /services/docker-proxy.
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read
    image: ghcr.io/gizmo385/image-updates-tracker-bot:main
    volumes:
      - ./overrides.yaml:/config/overrides.yaml:ro
    env_file: .env
    environment:
      # The digest leads with the Upgrades board and Claude's verdicts.
      # VIKUNJA_API_TOKEN is in .env, shared with release-feeds.
      VIKUNJA_API_URL: http://vikunja:3456/api/v1
      VIKUNJA_PROJECT_ID: "2"
      VIKUNJA_PUBLIC_URL: https://board.acbc.house
      OTEL_SERVICE_NAME: updates-tracker-discord-bot
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=updates-tracker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
    restart: unless-stopped
    networks:
      - ai
      - board
      - otel

networks:
  caddy:
    external: true
  board:
    external: true
  ai:
    external: true
  otel:
    external: true
  docker-proxy:
    external: true
