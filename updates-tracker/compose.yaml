services:
  release-feeds:
    image: ghcr.io/gizmo385/image-updates-tracker:main
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./overrides.yaml:/config/overrides.yaml:ro
    env_file: .env
    environment:
      # Traces to SigNoz via Alloy. service.name matches the name Alloy derives
      # for this container's logs so SigNoz can correlate them.
      OTEL_SERVICE_NAME: updates-tracker-release-feeds
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=updates-tracker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
    restart: unless-stopped
    networks:
      - caddy
      - ai
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@updates.host: "updates.alpenglow.acbc.house"
      caddy.reverse_proxy: "@updates {{upstreams http 8585}}"

  discord-bot:
    image: ghcr.io/gizmo385/image-updates-tracker-bot:main
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./overrides.yaml:/config/overrides.yaml:ro
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: updates-tracker-discord-bot
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=updates-tracker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-alloy:4318
    restart: unless-stopped
    networks:
      - ai
      - otel

networks:
  caddy:
    external: true
  ai:
    external: true
  otel:
    external: true
