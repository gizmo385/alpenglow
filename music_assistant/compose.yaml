services:
  music-assistant-server:
    image: ghcr.io/music-assistant/server:2.10.9@sha256:4ac0d5844363fbbefd6a61251df09d96cd546e05e01b8c1cc1a28803f0935e07
    container_name: music-assistant-server
    hostname: music-assistant
    restart: unless-stopped
    user: 116:119
    networks:
      - caddy
    ports:
      - 8097:8097
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@music.host: "music.acbc.house"
      caddy_0.reverse_proxy: "@music {{upstreams http 8095}}"
    volumes:
      - ./data:/data/
      - /data/jellyfin/media/adam_music/:/media/adam_music:ro 
      - /data/jellyfin/media/chris_music_library//:/media/chris_music:ro
    environment:
      # Provide logging level as environment variable.
      # default=info, possible=(critical, error, warning, info, debug)
      - LOG_LEVEL=info
      - XDG_CACHE_HOME=/data/.cache

networks:
  caddy:
    external: true
