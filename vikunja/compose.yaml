# Vikunja: the kanban board for the upgrade pipeline (and later, other Claude
# jobs). Tailnet only, login through Keycloak. See README.md.
services:
  vikunja:
    image: vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://board.acbc.house/
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres.postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_AUTH_OPENID_ENABLED: "true"
      # Webhooks go to the Claude dispatcher on the private `board` network.
      # Vikunja blocks private addresses by default (SSRF protection); only
      # Keycloak users can create webhooks, and registration is off.
      VIKUNJA_OUTGOINGREQUESTS_ALLOWNONROUTABLEIPS: "true"
    volumes:
      # Defines the Keycloak provider; its URL and secret come from .env.
      - ./config.yml:/etc/vikunja/config.yml:ro
      # Attachments. Vikunja runs as uid 1000: `sudo chown 1000 files`.
      - ./files:/app/vikunja/files
    networks:
      - caddy
      - postgres
      - board
    labels:
      caddy: "*.acbc.house"
      caddy.@board.host: "board.acbc.house"
      caddy.reverse_proxy: "@board {{upstreams http 3456}}"

networks:
  caddy:
    external: true
  postgres:
    external: true
  # Vikunja and the Claude dispatcher only.
  board:
    name: board
