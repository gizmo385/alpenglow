[project]
name = "pin"
version = "0.1.0"
description = "Keep image versions in versions.yaml and write them into compose files and Dockerfiles"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.18",
]

[project.scripts]
pin = "pin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
