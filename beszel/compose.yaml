services:
  beszel:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./beszel_data:/beszel_data
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@dash.host: "dash.alpenglow.acbc.house"
      caddy.reverse_proxy: "@dash {{upstreams http 8090}}"
    networks:
      - caddy
    env_file: .hub_env

  beszel-agent:
    image: henrygd/beszel-agent:0.21.1-alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/nvme0:/dev/nvme0
      - /dev/zfs:/dev/zfs # Required for ZFS pool monitoring
    volumes:
      # Read-only Docker API from beszel-socket-proxy (/services/docker-proxy):
      # this agent is on the host network, so it gets its own unix socket.
      - /run/beszel-socket-proxy:/run/beszel-socket-proxy:ro
    cap_add:
      - SYS_RAWIO # Required for S.M.A.R.T data
      - SYS_ADMIN # Required for NVMe S.M.A.R.T data
    env_file: .agent_env
    environment:
      DOCKER_HOST: unix:///run/beszel-socket-proxy/docker.sock


networks:
  caddy:
    external: true
