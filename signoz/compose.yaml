# SigNoz (UI/API, ingester, ClickHouse) plus the Keycloak login in front of
# it, the Alloy collection agent, OBI and the host metrics agents
# (host-metrics, node-exporter). The SigNoz stack started as Foundry output
# (github.com/SigNoz/foundry); it's maintained by hand now, so check SigNoz's
# release notes for config changes when bumping its images (versions.yaml).
# Its service names are Foundry's; renaming one orphans its container.

services:
  # UI and API. No login of its own: every request is SigNoz's root user
  # ("impersonation"; OIDC proper is an Enterprise feature). The root user's
  # email, password and org ID come from .env; they must be the existing
  # admin's email and password and the existing org's ID, or SigNoz
  # overwrites them or creates a second, empty org. SigNoz refuses
  # impersonation alongside its own login or API keys, so both are off. To go
  # back to SigNoz's own login, drop the four SIGNOZ_USER_ROOT/IDENTN entries;
  # users, dashboards and API keys are untouched.
  signoz-signoz-0:
    image: signoz/signoz:v0.149.0@sha256:dc31f487d69452b90da87cf7208b334963de776349b3c2b661bf88990edf9ca4
    container_name: signoz-signoz-0
    restart: unless-stopped
    # Shared Postgres DSN (SIGNOZ_SQLSTORE_POSTGRES_DSN) and the root user.
    env_file:
      - path: .env
        required: true
    environment:
      SIGNOZ_SQLSTORE_PROVIDER: postgres
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
      # Don't phone home usage stats (which include user emails by default).
      SIGNOZ_STATSREPORTER_ENABLED: "false"
      # Public URL (both default to localhost:8080). The alertmanager one is
      # what links in alert notifications use.
      SIGNOZ_GLOBAL_EXTERNAL__URL: https://monitoring.acbc.house
      SIGNOZ_ALERTMANAGER_SIGNOZ_EXTERNAL__URL: https://monitoring.acbc.house
      SIGNOZ_USER_ROOT_ENABLED: "true"
      SIGNOZ_IDENTN_IMPERSONATION_ENABLED: "true"
      SIGNOZ_IDENTN_TOKENIZER_ENABLED: "false"
      SIGNOZ_IDENTN_APIKEY_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Not on caddy: with no login, anything that can reach :8080 is root. The
    # only way in is oauth2-proxy below, which carries the Caddy labels; only
    # the SigNoz stack, Alloy and OBI share signoz-network.
    networks:
      - signoz-network
      - postgres

  # OTLP into ClickHouse. Only Alloy talks to it, over signoz-network. Its
  # pipelines are nop until SigNoz pushes config over OpAMP (opamp.yaml).
  ingester:
    image: signoz/signoz-otel-collector:v0.144.15@sha256:3996e0ffc58bc86d433062a45ef7ff960a4768da0619944f651a17254d634daf
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    volumes:
      - ./ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./ingester/opamp.yaml:/etc/opamp-config.yaml:ro
    networks:
      signoz-network:
        aliases:
          - signoz-ingester

  # One-shot: creates and migrates the ClickHouse schema, then exits. Runs on
  # every `up`, so a SigNoz upgrade's migrations happen here.
  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.15@sha256:3996e0ffc58bc86d433062a45ef7ff960a4768da0619944f651a17254d634daf
    container_name: signoz-telemetrystore-migrator
    restart: on-failure
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    networks:
      - signoz-network

  # Telemetry storage (see clickhouse/config-0-0.yaml for the CPU trims).
  signoz-telemetrystore-clickhouse-0-0:
    image: clickhouse/clickhouse-server:25.12.5@sha256:cacf32d6884291dc2ff5e0156a97f46fc53ff7c929a7906d114e268a929dfd3a
    container_name: signoz-telemetrystore-clickhouse-0-0
    restart: unless-stopped
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro
    networks:
      - signoz-network

  # One-shot: fetches SigNoz's histogramQuantile UDF (clickhouse/functions.yaml)
  # into the user-scripts volume.
  signoz-telemetrystore-clickhouse-user-scripts:
    image: clickhouse/clickhouse-server:25.12.5@sha256:cacf32d6884291dc2ff5e0156a97f46fc53ff7c929a7906d114e268a929dfd3a
    container_name: signoz-telemetrystore-clickhouse-user-scripts
    restart: on-failure
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
    networks:
      - signoz-network

  signoz-telemetrykeeper-clickhousekeeper-0:
    image: clickhouse/clickhouse-keeper:25.12.5@sha256:525b8b0f93ccb371131c46f22a066ea43d33d74aba314203e8044609945d8524
    container_name: signoz-telemetrykeeper-clickhousekeeper-0
    restart: unless-stopped
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-h", "localhost", "-p", "9181", "-q", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - ./clickhouse-keeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
    networks:
      - signoz-network

  # The only way into SigNoz from outside signoz-network: SigNoz has no login
  # of its own (impersonation, see signoz-signoz-0), so this proxy lets in
  # Keycloak's Admin group and nobody else (.proxy_env).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    container_name: signoz-oauth2-proxy
    restart: unless-stopped
    env_file:
      - path: .proxy_env
        required: true
    networks:
      - caddy
      - signoz-network
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@signoz.host: "monitoring.acbc.house"
      caddy_0.reverse_proxy: "@signoz {{upstreams http 4180}}"
      # Old name, kept so bookmarks and older alert links still work.
      caddy_1: "*.alpenglow.acbc.house"
      caddy_1.@signoz_old.host: "signoz.alpenglow.acbc.house"
      caddy_1.redir: "@signoz_old https://monitoring.acbc.house{uri} permanent"

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: signoz-alloy
    # Container list and logs via /services/docker-proxy (read-only).
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read-logs
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # For prometheus.scrape's honor_metadata (see config.alloy).
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    # POSTGRES_EXPORTER_DSN (see .alloy_env.example). Kept out of .env, which
    # the SigNoz container loads whole.
    env_file: .alloy_env
    extra_hosts:
      # node-exporter on the host network (see below).
      - host.docker.internal:host-gateway
    ports:
      # OTLP gRPC for host-metrics, which is on the host network. docker0
      # address only, so not reachable from the LAN or tailnet.
      - 10.0.0.1:4317:4317
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Host journal for loki.source.journal (machine-id names its directory).
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Log read positions, so restarts don't resend or skip logs.
      - alloy-data:/var/lib/alloy/data
    labels:
      caddy_0: "*.alpenglow.acbc.house"
      caddy_0.@alloy.host: "alloy.alpenglow.acbc.house"
      caddy_0.reverse_proxy: "@alloy {{upstreams http 12345}}"
      # OTLP/HTTP for machines outside Docker (Claude Code on personal
      # machines, via the dotfiles). Tailnet/LAN only like every :443 site;
      # the public edge only reaches the :10443 blocks. No auth.
      caddy_1: "*.acbc.house"
      caddy_1.@otlp.host: "otlp.acbc.house"
      caddy_1.reverse_proxy: "@otlp {{upstreams http 4318}}"
    networks:
      - signoz-network
      - caddy
      # For apps that push OTLP but aren't otherwise on the caddy network.
      - otel
      # Database exporters (prometheus.exporter.postgres / .redis).
      - postgres
      - redis

  # Host CPU, memory, disks, filesystems and network as OpenTelemetry
  # hostmetrics, which SigNoz's Infrastructure > Hosts page expects (see
  # host-metrics/config.yaml). On the host network so network counters are
  # the host's rather than a container's.
  host-metrics:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: signoz-host-metrics
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./host-metrics/config.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro,rslave

  # What hostmetrics lacks: ZFS (ARC, pool I/O) and hardware temperatures.
  # Listens only on the docker0 bridge address (host.docker.internal), not
  # the LAN or tailnet.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: signoz-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.0.0.1:9100
      - --collector.disable-defaults
      - --collector.zfs
      - --collector.hwmon
    volumes:
      - /:/host:ro,rslave

  # OpenTelemetry eBPF Instrumentation: traces for every listening container
  # without app changes (see obi/config.yaml).
  obi:
    image: otel/ebpf-instrument:v1.0.0@sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02
    container_name: signoz-obi
    restart: unless-stopped
    command:
      - --config=/config/obi.yaml
    # eBPF needs to see and hook every process on the host.
    privileged: true
    pid: host
    volumes:
      - ./obi/config.yaml:/config/obi.yaml:ro
      # Container names for service naming. The only consumer left on the raw
      # socket (not /services/docker-proxy): privileged + pid: host is already
      # full host access, so filtering its Docker API would add nothing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - signoz-network

volumes:
  alloy-data:
  signoz-telemetrykeeper-0-data:
    name: signoz-telemetrykeeper-0-data
  signoz-telemetrystore-0-0-data:
    name: signoz-telemetrystore-0-0-data
  signoz-telemetrystore-user-scripts:
    name: signoz-telemetrystore-user-scripts

networks:
  signoz-network:
    name: signoz-network
  caddy:
    external: true
  otel:
    external: true
  docker-proxy:
    external: true
  postgres:
    external: true
  redis:
    external: true
