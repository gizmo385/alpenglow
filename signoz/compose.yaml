# The SigNoz stack itself is generated by Foundry from casting.yaml into
# pours/ (see README.md). This file adds the Keycloak login in front of it,
# the Alloy collection agent, OBI and the host metrics agents (host-metrics,
# node-exporter).
include:
  - pours/deployment/compose.yaml

services:
  # The only way into SigNoz from outside signoz-network: SigNoz has no login
  # of its own (impersonation, see casting.yaml), so this proxy lets in
  # Keycloak's Admin group and nobody else (.proxy_env).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: signoz-oauth2-proxy
    restart: unless-stopped
    env_file:
      - path: .proxy_env
        required: true
    networks:
      - caddy
      - signoz-network
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@signoz.host: "monitoring.acbc.house"
      caddy_0.reverse_proxy: "@signoz {{upstreams http 4180}}"
      # Old name, kept so bookmarks and older alert links still work.
      caddy_1: "*.alpenglow.acbc.house"
      caddy_1.@signoz_old.host: "signoz.alpenglow.acbc.house"
      caddy_1.redir: "@signoz_old https://monitoring.acbc.house{uri} permanent"

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: signoz-alloy
    # Container list and logs via /services/docker-proxy (read-only).
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read-logs
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # For prometheus.scrape's honor_metadata (see config.alloy).
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    # POSTGRES_EXPORTER_DSN (see .alloy_env.example). Kept out of .env, which
    # the SigNoz container loads whole.
    env_file: .alloy_env
    extra_hosts:
      # node-exporter on the host network (see below).
      - host.docker.internal:host-gateway
    ports:
      # OTLP gRPC for host-metrics, which is on the host network. docker0
      # address only, so not reachable from the LAN or tailnet.
      - 10.0.0.1:4317:4317
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Host journal for loki.source.journal (machine-id names its directory).
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Log read positions, so restarts don't resend or skip logs.
      - alloy-data:/var/lib/alloy/data
    labels:
      caddy_0: "*.alpenglow.acbc.house"
      caddy_0.@alloy.host: "alloy.alpenglow.acbc.house"
      caddy_0.reverse_proxy: "@alloy {{upstreams http 12345}}"
      # OTLP/HTTP for machines outside Docker (Claude Code on personal
      # machines, via the dotfiles). Tailnet/LAN only like every :443 site;
      # the public edge only reaches the :10443 blocks. No auth.
      caddy_1: "*.acbc.house"
      caddy_1.@otlp.host: "otlp.acbc.house"
      caddy_1.reverse_proxy: "@otlp {{upstreams http 4318}}"
    networks:
      - signoz-network
      - caddy
      # For apps that push OTLP but aren't otherwise on the caddy network.
      - otel
      # Database exporters (prometheus.exporter.postgres / .redis).
      - postgres
      - redis

  # Host CPU, memory, disks, filesystems and network as OpenTelemetry
  # hostmetrics, which SigNoz's Infrastructure > Hosts page expects (see
  # host-metrics/config.yaml). On the host network so network counters are
  # the host's rather than a container's.
  host-metrics:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: signoz-host-metrics
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./host-metrics/config.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro,rslave

  # What hostmetrics lacks: ZFS (ARC, pool I/O) and hardware temperatures.
  # Listens only on the docker0 bridge address (host.docker.internal), not
  # the LAN or tailnet.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: signoz-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.0.0.1:9100
      - --collector.disable-defaults
      - --collector.zfs
      - --collector.hwmon
    volumes:
      - /:/host:ro,rslave

  # OpenTelemetry eBPF Instrumentation: traces for every listening container
  # without app changes (see obi/config.yaml).
  obi:
    image: otel/ebpf-instrument:v0.13.0
    container_name: signoz-obi
    restart: unless-stopped
    command:
      - --config=/config/obi.yaml
    # eBPF needs to see and hook every process on the host.
    privileged: true
    pid: host
    volumes:
      - ./obi/config.yaml:/config/obi.yaml:ro
      # Container names for service naming. The only consumer left on the raw
      # socket (not /services/docker-proxy): privileged + pid: host is already
      # full host access, so filtering its Docker API would add nothing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - signoz-network

volumes:
  alloy-data:

networks:
  otel:
    external: true
  docker-proxy:
    external: true
  postgres:
    external: true
  redis:
    external: true
