# The SigNoz stack itself is generated by Foundry from casting.yaml into
# pours/ (see README.md). This file adds the Alloy collection agent.
include:
  - pours/deployment/compose.yaml

services:
  alloy:
    image: grafana/alloy:v1.20.0
    container_name: signoz-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Log read positions, so restarts don't resend or skip logs.
      - alloy-data:/var/lib/alloy/data
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@alloy.host: "alloy.alpenglow.acbc.house"
      caddy.reverse_proxy: "@alloy {{upstreams http 12345}}"
    networks:
      - signoz-network
      - caddy

volumes:
  alloy-data:
