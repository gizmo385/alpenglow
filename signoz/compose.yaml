# The SigNoz stack itself is generated by Foundry from casting.yaml into
# pours/ (see README.md). This file adds the Alloy collection agent, OBI and
# node-exporter.
include:
  - pours/deployment/compose.yaml

services:
  alloy:
    image: grafana/alloy:v1.20.0
    container_name: signoz-alloy
    # Container list and logs via /services/docker-proxy (read-only).
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read-logs
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # For prometheus.scrape's honor_metadata (see config.alloy).
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    # POSTGRES_EXPORTER_DSN (see .alloy_env.example). Kept out of .env, which
    # the SigNoz container loads whole.
    env_file: .alloy_env
    extra_hosts:
      # node-exporter on the host network (see below).
      - host.docker.internal:host-gateway
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Host journal for loki.source.journal (machine-id names its directory).
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Log read positions, so restarts don't resend or skip logs.
      - alloy-data:/var/lib/alloy/data
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@alloy.host: "alloy.alpenglow.acbc.house"
      caddy.reverse_proxy: "@alloy {{upstreams http 12345}}"
    networks:
      - signoz-network
      - caddy
      # For apps that push OTLP but aren't otherwise on the caddy network.
      - otel
      # Database exporters (prometheus.exporter.postgres / .redis).
      - postgres
      - redis

  # Host metrics: CPU, memory, disks, filesystems, network, ZFS, temperatures.
  # A separate container rather than Alloy's built-in unix exporter because
  # network counters need the host's network namespace. Listens only on the
  # docker0 bridge address (host.docker.internal), not the LAN or tailnet.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: signoz-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.0.0.1:9100
      # Per-container veth pairs and bridges would add hundreds of short-lived
      # series; container traffic is Beszel's job.
      - --collector.netdev.device-exclude=^(lo|veth.*|br-.*|docker0)$$
      - --collector.netclass.ignored-devices=^(lo|veth.*|br-.*|docker0)$$
    volumes:
      - /:/host:ro,rslave

  # OpenTelemetry eBPF Instrumentation: traces for every listening container
  # without app changes (see obi/config.yaml).
  obi:
    image: otel/ebpf-instrument:v0.13.0
    container_name: signoz-obi
    restart: unless-stopped
    command:
      - --config=/config/obi.yaml
    # eBPF needs to see and hook every process on the host.
    privileged: true
    pid: host
    volumes:
      - ./obi/config.yaml:/config/obi.yaml:ro
      # Container names for service naming. The only consumer left on the raw
      # socket (not /services/docker-proxy): privileged + pid: host is already
      # full host access, so filtering its Docker API would add nothing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - signoz-network

volumes:
  alloy-data:

networks:
  otel:
    external: true
  docker-proxy:
    external: true
  postgres:
    external: true
  redis:
    external: true
