# ClickHouse's whole config (CLICKHOUSE_CONFIG in compose.yaml), from SigNoz's
# Foundry output. ClickHouse's own system logs cost CPU to write and merge, so
# only query_log, part_log and error_log are kept (enough to see what
# ClickHouse is busy with); the rest (metric_log, trace_log, text_log, ...)
# are left out on purpose.
dictionaries_config: '*_dictionary.xml'
display_name: cluster
distributed_ddl:
  path: /clickhouse/task_queue/ddl
error_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
format_schema_path: /var/lib/clickhouse/format_schemas/
http_port: 8123
interserver_http_port: 9009
listen_host: 0.0.0.0
logger:
  console: 1
  count: 10
  formatting:
    type: console
  level: information
  size: 1000M
macros:
  replica: "00"
  shard: "00"
part_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
path: /var/lib/clickhouse/
profiles:
  default:
    # Foundry's default was 0, but ClickHouse 25.12 has no fallback parser, so
    # JSON_VALUE (used by SigNoz for log body queries) fails with
    # "Functions JSON* are not supported". Keep this at 1.
    allow_simdjson: 1
    load_balancing: random
    log_queries: 1
    # The sampling query profiler, which fed trace_log.
    query_profiler_cpu_time_period_ns: 0
    query_profiler_real_time_period_ns: 0
query_log:
  flush_interval_milliseconds: 30000
  partition_by: toYYYYMM(event_date)
  ttl: event_date + INTERVAL 1 DAY DELETE
quotas:
  default:
    interval:
      duration: 3600
      errors: 0
      execution_time: 0
      queries: 0
      read_rows: 0
      result_rows: 0
remote_servers:
  cluster:
    shard:
    - replica:
      - host: signoz-telemetrystore-clickhouse-0-0
        port: 9000
tcp_port: 9000
tmp_path: /var/lib/clickhouse/tmp/
user_defined_executable_functions_config: '*functions.yaml'
user_directories:
  users_xml:
    # This file, by its name inside the container.
    path: config-0-0.yaml
user_files_path: /var/lib/clickhouse/user_files/
user_scripts_path: /var/lib/clickhouse/user_scripts/
users:
  default:
    access_management: 1
    named_collection_control: 1
    networks:
      ip: ::/0
    password: ""
    profile: default
    quota: default
    show_named_collection: 1
    show_named_collection_secrets: 1
zookeeper:
  node:
  - host: signoz-telemetrykeeper-clickhousekeeper-0
    port: 9181
