# Image versions managed by the pin tool (tools/pin/README.md).
#
# Only images listed here are managed; everything else is left alone, so
# services move onto this file one at a time. Edit with the pin tool rather
# than hand-editing compose:
#
#   ./pin set NAME TAG    pin an image (and its group), looking up the digest
#   ./pin adopt NAME      on the server: pin exactly what runs now
#   ./pin check           CI runs this; fails if the repo and this file disagree
#
# Each key is an image name exactly as compose or a Dockerfile writes it,
# without the tag.
#
# policy is for the upgrade pipeline: auto-eligible | approve | manual | float.
# `manual` images are never upgraded automatically, whatever an approval says.

