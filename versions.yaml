# Image versions managed by the pin tool (tools/pin/README.md).
#
# Only images listed here are managed; everything else is left alone, so
# services move onto this file one at a time. Edit with the pin tool rather
# than hand-editing compose:
#
#   ./pin set NAME TAG    pin an image (and its group), looking up the digest
#   ./pin adopt NAME      on the server: pin exactly what runs now
#   ./pin check           CI runs this; fails if the repo and this file disagree
#
# Each key is an image name exactly as compose or a Dockerfile writes it,
# without the tag.
#
# policy is for the upgrade pipeline: auto-eligible | approve | manual | float.
# `manual` images are never upgraded automatically, whatever an approval says.
# `auto-eligible` images update themselves from the dashboard, on the rules in
# an optional `auto:` block (alpenglow_dashboard/app/README.md, "Automatic
# updates"):
#
#   auto:
#     every: daily       # hourly | daily | weekly | 6h | 2d | "0 4 * * *"
#     max_bump: patch    # patch | minor | major
#     soak: 2d           # how long a release must be out first
#     verdict: Easy      # Claude's verdict needed: Easy | Needs care | any
#     monitor: FreshRSS  # Uptime Kuma monitor(s) that must be up afterwards
#
# Every member of a group must be auto-eligible for the group to update. A
# float entry on a moving tag (main) can set `auto: {follow: true}` instead.
# An image that publishes only a moving tag plus per-build tags (latest and
# sha-<commit>) is pinned to a per-build tag with `auto: {follow: latest}`:
# each update repins it to the sha-* tag latest points at, with no verdict
# or soak, since there's no version to judge.

