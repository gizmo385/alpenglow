- id: '1760369932450'
  alias: Cast to Google Hub
  description: ''
  use_blueprint:
    path: kind3r/cast-and-re-cast-a-lovelace-view-to-a-google-hub.yaml
    input:
      player: media_player.kitchen_display
      view: '0'
      dashboard: dashboard-immichframe
- id: '1774116217998'
  alias: Turn on dining room lamp
  description: ''
  triggers:
  - trigger: time_pattern
    hours: '18'
    minutes: '0'
    seconds: '0'
  conditions: []
  actions:
  - type: turn_on
    device_id: 349c1c3c9c3d9d8ef8b175a5b708235f
    entity_id: 8c5e8c9becaf4d9861e18d1b2fd36e20
    domain: switch
  mode: single
- id: '1774116278793'
  alias: Turn off dining room lamp
  description: ''
  triggers:
  - trigger: time_pattern
    hours: '22'
    minutes: '0'
    seconds: '0'
  conditions: []
  actions:
  - type: turn_off
    device_id: 349c1c3c9c3d9d8ef8b175a5b708235f
    entity_id: 8c5e8c9becaf4d9861e18d1b2fd36e20
    domain: switch
  mode: single
- id: '1780382819117'
  alias: Set motion detection when not home
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - zone.home
    attribute: persons
    below: 1
  conditions: []
  actions:
  - action: camera.enable_motion_detection
    metadata: {}
    target:
      entity_id:
      - camera.entryway
      - camera.porch
    data: {}
  mode: single
- id: '1780382894019'
  alias: Disable motion detection when home
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - zone.home
    attribute: persons
    above: 0
  conditions: []
  actions:
  - action: camera.disable_motion_detection
    metadata: {}
    target:
      entity_id:
      - camera.entryway
      - camera.porch
    data: {}
  mode: single
