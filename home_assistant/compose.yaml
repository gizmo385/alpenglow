services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    ports:
      - 1400:1400
    networks:
      - caddy
      - mosquitto
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@home.host: "home.acbc.house"
      caddy_0.reverse_proxy: "@home {{upstreams http 8123}}"
      caddy_1: "*.internal.acbc.house"
      caddy_1.@home-internal.host: "home.internal.acbc.house"
      caddy_1.reverse_proxy: "@home-internal {{upstreams http 8123}}"

networks:
  caddy:
    external: true
  mosquitto:
    external: true

