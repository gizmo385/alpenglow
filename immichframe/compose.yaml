services:
  immichframe: 
    restart: always 
    image: ghcr.io/immichframe/immichframe:v1.0.37.0@sha256:edae2c0b9ab6e1384634582b2bab6246429e14bc209ff6ecc091fc9eedd4582c
    environment:
      TZ: America/Denver
    volumes:
      - ./config:/app/Config
    networks:
      - caddy
    labels:
      caddy: "*.internal.acbc.house"
      caddy.@immichframe.host: "immichframe.internal.acbc.house"
      caddy.reverse_proxy: "@immichframe {{upstreams http 8080}}"

networks:
  caddy:
    external: true
