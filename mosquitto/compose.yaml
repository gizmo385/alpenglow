services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    container_name: mosquitto
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    expose:
      - 1883
      - 9001    
        # ports:
        #  - 1883:1883
        #  - 9001:9001
    restart: unless-stopped
    user: "118:121" 
    environment:
      - PUID=118
      - PGID=121
      - TZ=America/Denver
    networks:
      - mosquitto

networks:
  mosquitto:
    name: mosquitto
