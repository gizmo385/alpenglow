services:
  monitoring:
    container_name: glances
    # Read-only Docker API plus container stats, via /services/docker-proxy.
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read-stats
    image: nicolargo/glances:latest
    restart: unless-stopped
    pid: host
    volumes:
      - ./glances.conf:/etc/glances/glances.conf
      - /etc/os-release:/etc/os-release:ro
    environment:
      - "GLANCES_OPT=-w"
    networks:
      - caddy
    labels:
      caddy: "*.alpenglow.acbc.house"
      caddy.@glances.host: "glances.alpenglow.acbc.house"
      caddy.reverse_proxy: "@glances {{upstreams 61208}}"

networks:
  caddy:
    external: true
  docker-proxy:
    external: true
