services:
  monitoring:
    container_name: glances
    # Read-only Docker API plus container stats, via /services/docker-proxy.
    extends:
      file: ../docker-proxy/profiles.yaml
      service: docker-read-stats
    image: nicolargo/glances:4.5.9@sha256:1d994d181732cfbf68b7c5826a1f71b89624e3eaaa2fe28b28048b2f61b200d7
    restart: unless-stopped
    volumes:
      - ./glances.conf:/etc/glances/glances.conf
      - /etc/os-release:/etc/os-release:ro
    environment:
      # REST API only, for the dashboard's host stats (load, cpu, mem, memswap,
      # fs). The API has no auth, and host process command lines can carry
      # secrets (it once served Kopia's password), so no `pid: host`: it only
      # sees its own process. --disable-process still leaves the endpoint up.
      - "GLANCES_OPT=-w --disable-webui --disable-process"
    networks:
      # Only so the dashboard can reach the API at glances:61208; no Caddy route.
      - caddy

networks:
  caddy:
    external: true
  docker-proxy:
    external: true
