services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: acbc.house
    volumes:
      - ./config:/app/config
    # Caddy labels removed (E3): the alpenglow dashboard now owns the apex
    # acbc.house. Homepage keeps running unlabeled pending retirement; restore
    # the labels to roll back:
    #   caddy: acbc.house
    #   caddy.reverse_proxy: "{{upstreams http 3000}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
