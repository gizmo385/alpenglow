services:
  trek:
    image: mauriceboe/trek:5.1.3@sha256:6a6bb48bdf5c71314717ef3f1de8da51855d55f68e911ab68fd963644c7416d9
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@trek.host: "travel.acbc.house"
      caddy_0.reverse_proxy: "@trek {{upstreams http 3000}}"
      caddy_1: "*.acbc.house:10443"
      caddy_1.@trek.host: "travel.acbc.house"
      caddy_1.reverse_proxy: "@trek {{upstreams http 3000}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
