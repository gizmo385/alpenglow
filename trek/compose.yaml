services:
  trek:
    image: mauriceboe/trek:5.1.0@sha256:23bf3fa6a134dc38a3b4f40ef8f7e8040abc96965105dffdcfcf5f202fb5d0b7
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    labels:
      caddy_0: "*.acbc.house"
      caddy_0.@trek.host: "travel.acbc.house"
      caddy_0.reverse_proxy: "@trek {{upstreams http 3000}}"
      caddy_1: "*.acbc.house:10443"
      caddy_1.@trek.host: "travel.acbc.house"
      caddy_1.reverse_proxy: "@trek {{upstreams http 3000}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
